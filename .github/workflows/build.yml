name: Build exe + apk

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

env:
  # (선택) 저장소 Secret FIREBASE_CONFIG_JSON 에 firebaseConfig 객체를 JSON 한 줄로 넣으면 빌드에 주입됩니다.
  FIREBASE_CONFIG_JSON: ${{ secrets.FIREBASE_CONFIG_JSON }}

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
        env: { ELECTRON_SKIP_BINARY_DOWNLOAD: '1' }
      - run: npm run test:unit
      - run: npm run build:web

  windows-exe:
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm run dist:win
      - uses: actions/upload-artifact@v4
        with:
          name: windows-exe
          path: |
            dist/PCM-Panel-Setup-*.exe
            dist/PCM-Panel-Portable-*.exe
          if-no-files-found: error

  android-apk:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 21 }
      - uses: android-actions/setup-android@v3
      - run: npm ci
        env: { ELECTRON_SKIP_BINARY_DOWNLOAD: '1' }
      - run: npm run cap:android
      - name: Build debug APK (설치 가능한 디버그 서명 APK)
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon
      - run: mv android/app/build/outputs/apk/debug/app-debug.apk PCM-Panel-${{ github.run_number }}.apk
      - uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: PCM-Panel-*.apk
          if-no-files-found: error

  release:
    needs: [windows-exe, android-apk]
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with: { path: out, merge-multiple: true }
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: 천공월아 관리 패널 build ${{ github.run_number }}
          body: |
            - Windows: `PCM-Panel-Setup-*.exe`(설치형) / `PCM-Panel-Portable-*.exe`(설치 없이 실행)
            - Android: `PCM-Panel-*.apk` (디버그 서명 — "출처를 알 수 없는 앱 설치" 허용 후 설치)
          files: out/*
          prerelease: true
